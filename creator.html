<body class="bg-[#050505] text-white">
    <!-- Login -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-[24px] w-full max-w-sm text-center">
            <h1 class="text-3xl font-black">WAREEZ <span class="text-purple-500">STUDIO</span> <span class="text-[10px] bg-green-500 text-black px-2 py-1 rounded-full">FIREBASE LIVE</span></h1>
            <p class="text-xs text-zinc-500 mt-2 mb-6">Real-time orders from main site</p>
            <input id="password" type="password" placeholder="Password" class="w-full bg-black border border-zinc-800 p-4 rounded-xl outline-none">
            <button onclick="login()" class="w-full bg-white text-black p-4 rounded-xl font-black mt-4">ENTER STUDIO</button>
            <p class="text-[10px] text-zinc-600 mt-3">Default: wareez123</p>
        </div>
    </div>

    <div id="studio" class="hidden">
        <div class="bg-black border-b border-zinc-900 p-4 sticky top-0 z-20">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="font-black text-xl">WAREEZ CREATOR STUDIO <span class="text-xs bg-green-500/20 text-green-400 px-2 py-1 rounded-full ml-2"><span class="w-2 h-2 bg-green-500 rounded-full inline-block animate-pulse mr-1"></span>LIVE FIREBASE</span></h1>
                <div class="flex gap-2">
                    <span id="liveCount" class="bg-zinc-900 px-3 py-1 rounded-full text-xs">0 orders</span>
                    <button onclick="location.reload()" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-xs">Logout</button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto p-4 grid lg:grid-cols-4 gap-4">
            <div class="lg:col-span-4 grid grid-cols-4 gap-4">
                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl"><p class="text-[10px] text-zinc-500 font-bold">TOTAL</p><p id="total" class="text-2xl font-black">0</p></div>
                <div class="bg-yellow-500/10 border border-yellow-500/20 p-4 rounded-2xl"><p class="text-[10px] text-yellow-500 font-bold">PENDING</p><p id="pending" class="text-2xl font-black text-yellow-400">0</p></div>
                <div class="bg-green-500/10 border border-green-500/20 p-4 rounded-2xl"><p class="text-[10px] text-green-500 font-bold">REVENUE</p><p id="revenue" class="text-2xl font-black text-green-400">₦0</p></div>
                <div class="bg-purple-500/10 border border-purple-500/20 p-4 rounded-2xl"><p class="text-[10px] text-purple-500 font-bold">KUDA ACCOUNT</p><p class="font-mono font-bold">3003350273</p><p class="text-[10px]">Yusuf Olywatoyin</p></div>
            </div>

            <div class="lg:col-span-3 bg-zinc-900 border border-zinc-800 rounded-[24px] p-6">
                <h2 class="font-bold mb-4">🔴 Live Orders (Auto-updates)</h2>
                <div id="orders" class="space-y-3 max-h-[700px] overflow-y-auto"></div>
            </div>

            <div class="bg-black border border-zinc-800 rounded-[24px] p-6 h-fit sticky top-[80px]">
                <h3 class="font-bold text-sm mb-2">Order Action</h3>
                <div id="action" class="text-zinc-500 text-sm text-center py-10">Select an order from left</div>
            </div>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "YOUR_NEW_API_KEY_HERE", // REPLACE WITH NEW KEY
    authDomain: "tubeflix-78ca4.firebaseapp.com",
    projectId: "tubeflix-78ca4",
    storageBucket: "tubeflix-78ca4.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let orders = [];
let selected = null;

function login(){
    if(document.getElementById('password').value === 'wareez123'){
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('studio').classList.remove('hidden');
        listenOrders();
    } else alert('Wrong password');
}

function listenOrders(){
    // REAL-TIME LISTENER - Orders appear instantly as customer pays
    db.collection('wareez_orders').orderBy('created_at', 'desc').onSnapshot(snapshot => {
        orders = [];
        snapshot.forEach(doc => {
            orders.push({firestoreId: doc.id, ...doc.data()});
        });
        render();
    }, err => {
        document.getElementById('orders').innerHTML = `Error: ${err.message}<br><br>Go to Firebase Console > Firestore > Rules and set: <pre class="bg-black p-2 mt-2 text-[10px]">rules_version = '2'; service cloud.firestore { match /databases/{database}/documents { match /{document=**} { allow read, write: if true; } } }</pre>`;
    });
}

function render(){
    document.getElementById('liveCount').innerText = orders.length + ' orders';
    document.getElementById('total').innerText = orders.length;
    document.getElementById('pending').innerText = orders.filter(o=>o.status==='pending_payment').length;
    const rev = orders.reduce((s,o)=>s+(parseInt(o.price)||0),0);
    document.getElementById('revenue').innerText = '₦'+rev.toLocaleString();

    const container = document.getElementById('orders');
    if(!orders.length){
        container.innerHTML = `<div class="text-center py-20 text-zinc-600"><i class="fas fa-satellite-dish text-3xl mb-3"></i><p>Waiting for orders... Keep this tab open. Orders from main site will pop here instantly.</p></div>`;
        return;
    }
    container.innerHTML = orders.map((o,i)=>`
        <div onclick="selectOrder(${i})" class="cursor-pointer border ${selected && selected.firestoreId===o.firestoreId ? '!border-purple-600 bg-purple-600/10' : 'border-zinc-800 bg-black'} p-4 rounded-2xl hover:border-zinc-700">
            <div class="flex justify-between">
                <div>
                    <p class="font-bold text-sm">${o.package_name} <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded-full">${o.id||o.firestoreId.slice(0,6)}</span></p>
                    <p class="text-xs text-zinc-400 truncate max-w-[280px] mt-1">${o.link}</p>
                    <p class="text-xs text-zinc-500 mt-1"><i class="fab fa-whatsapp text-green-500"></i> ${o.whatsapp}</p>
                </div>
                <div class="text-right">
                    <p class="font-black text-purple-400">₦${o.price}</p>
                    <span class="text-[9px] px-2 py-1 rounded-full font-bold ${o.status==='pending_payment'?'bg-yellow-500/20 text-yellow-400':'bg-green-500/20 text-green-400'}">${o.status}</span>
                </div>
            </div>
            ${o.proof_url ? `<a href="${o.proof_url}" target="_blank" class="text-[10px] text-blue-400 underline mt-2 inline-block"><i class="fas fa-receipt"></i> View Payment Receipt</a>` : ''}
            <p class="text-[10px] text-zinc-600 mt-1">${o.created_at_string||''}</p>
        </div>
    `).join('');
}

function selectOrder(i){
    selected = orders[i];
    render();
    document.getElementById('action').innerHTML = `
        <div class="text-left space-y-3">
            <img src="${selected.proof_url||''}" class="w-full rounded-xl border border-zinc-800 max-h-[200px] object-contain bg-zinc-900">
            <p class="text-xs"><b>Package:</b> ${selected.package_name}</p>
            <p class="text-xs"><b>Price:</b> <span class="text-green-400 font-black text-lg">₦${selected.price}</span></p>
            <p class="text-xs break-all"><b>Link:</b> <a href="${selected.link}" target="_blank" class="text-purple-400 underline">${selected.link}</a></p>
            <p class="text-xs"><b>WhatsApp:</b> <a href="https://wa.me/${(selected.whatsapp||'').replace(/[^0-9]/g,'')}" target="_blank" class="text-green-400">${selected.whatsapp}</a></p>
            <div class="pt-4 space-y-2">
                <button onclick="confirmAndBoost()" class="w-full bg-green-600 p-3 rounded-xl font-bold"><i class="fas fa-check"></i> Confirm Payment in Kuda & Boost</button>
                <button onclick="updateStatus('completed')" class="w-full bg-zinc-800 p-3 rounded-xl font-bold text-xs">Mark Completed</button>
                <button onclick="deleteOrder()" class="w-full bg-red-500/10 text-red-400 border border-red-500/20 p-3 rounded-xl text-xs">Delete</button>
            </div>
            <p id="actionRes" class="text-xs mt-2"></p>
        </div>
    `;
}

async function confirmAndBoost(){
    if(!confirm(`Did you receive ₦${selected.price} in Kuda 3003350273?`)) return;
    document.getElementById('actionRes').innerText = 'Boosting via API...';

    try {
        // Call your backend API
        const res = await fetch('api/boost.php', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({service_id: selected.service_id, link: selected.link, quantity: selected.qty, order_id: selected.id})
        });
        const data = await res.json();
        
        await db.collection('wareez_orders').doc(selected.firestoreId).update({status:'completed', boosted_at: new Date(), api_result: data});
        document.getElementById('actionRes').innerHTML = `<span class="text-green-400">✅ Boosted! API: ${JSON.stringify(data)}</span>`;
    } catch(e){
        // Even if API fails, mark as completed and you can boost manually in ExoSupplier panel
        await db.collection('wareez_orders').doc(selected.firestoreId).update({status:'completed'});
        document.getElementById('actionRes').innerText = 'Marked completed. Boost manually in ExoSupplier panel. Error: ' + e.message;
    }
}

async function updateStatus(s){
    await db.collection('wareez_orders').doc(selected.firestoreId).update({status:s});
}

async function deleteOrder(){
    if(!confirm('Delete?')) return;
    await db.collection('wareez_orders').doc(selected.firestoreId).delete();
    selected = null;
    document.getElementById('action').innerHTML = 'Deleted. Select another.';
}
