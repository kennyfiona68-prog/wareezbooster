<body class="bg-[#050505] text-white">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
<div class="bg-zinc-900 border border-zinc-800 p-8 rounded-[24px] w-full max-w-sm text-center">
<h1 class="text-2xl font-black">CREATOR STUDIO <span class="text-[10px] bg-green-500 text-black px-2 py-1 rounded-full">LIVE</span></h1>
<input id="pass" type="password" placeholder="Password wareez123" class="w-full bg-black border border-zinc-800 p-4 rounded-xl mt-6">
<button onclick="login()" class="w-full bg-white text-black p-4 rounded-xl font-black mt-4">ENTER</button>
<p id="loginStatus" class="text-xs text-zinc-500 mt-3"></p>
</div>
</div>

<div id="studio" class="hidden">
<div class="bg-black border-b border-zinc-900 p-4 sticky top-0 z-10">
<div class="max-w-6xl mx-auto flex justify-between">
<h1 class="font-black">CREATOR STUDIO <span id="fbStatus" class="text-[10px] bg-zinc-900 px-2 py-1 rounded-full">Connecting...</span></h1>
<div class="flex gap-2"><span id="count" class="bg-zinc-900 px-3 py-1 rounded-full text-xs">0 orders</span><button onclick="location.reload()" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-xs">Logout</button></div>
</div>
</div>

<div class="max-w-6xl mx-auto p-4 grid lg:grid-cols-3 gap-4">
<div class="lg:col-span-2 bg-zinc-900 border border-zinc-800 rounded-[24px] p-6">
<h2 class="font-bold mb-4">🔴 Live Orders from Main Site</h2>
<div id="list" class="space-y-3"></div>
</div>
<div class="bg-black border border-zinc-800 rounded-[24px] p-6 h-fit">
<div id="action" class="text-zinc-500 text-sm text-center py-10">Select order to manage</div>
</div>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFrJXqqHWXOPVe19mFVhtJwYKKA9ww4RA",
  authDomain: "tubeflix-78ca4.firebaseapp.com",
  projectId: "tubeflix-78ca4",
  storageBucket: "tubeflix-78ca4.appspot.com",
  messagingSenderId: "1031311220227",
  appId: "1:1031311220227:web:5a8f3e8b9c2d1e0f"
};

let db, orders=[], selected=null;

function login(){
  if(document.getElementById('pass').value !== 'wareez123') return alert('Wrong password');
  document.getElementById('login').classList.add('hidden');
  document.getElementById('studio').classList.remove('hidden');
  initFirebase();
}

function initFirebase(){
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    document.getElementById('fbStatus').innerText = '✅ Firebase Connected - Listening...';
    document.getElementById('fbStatus').className = 'text-[10px] bg-green-500/20 text-green-400 px-2 py-1 rounded-full';
    document.getElementById('loginStatus').innerText = '';
    listen();
  } catch(e){
    document.getElementById('fbStatus').innerText = '❌ ' + e.message;
    document.getElementById('fbStatus').className = 'text-[10px] bg-red-500/20 text-red-400 px-2 py-1 rounded-full';
  }
}

function listen(){
  db.collection('wareez_orders').orderBy('created_at','desc').onSnapshot(snap=>{
    orders=[];
    snap.forEach(d=> orders.push({fid:d.id, ...d.data()}));
    document.getElementById('count').innerText = orders.length + ' orders';
    render();
  }, err=>{
    document.getElementById('list').innerHTML = `<div class="bg-red-500/10 border border-red-500 p-4 rounded-xl text-xs">❌ Firestore Error: ${err.message}<br><br>1. Go to Firebase Console > Firestore > Rules<br>Paste:<br><pre class="bg-black p-2 mt-2">rules_version='2'; service cloud.firestore{match/databases/{database}/documents{match/{document=**}{allow read, write: if true;}}}</pre><br>2. Click Publish<br>3. Reload this page</div>`;
  });
}

function render(){
  const c = document.getElementById('list');
  if(!orders.length){ c.innerHTML = '<div class="text-center py-20 text-zinc-600">No orders yet. Keep this tab open. When someone orders from main site https://kennyfiona68-prog.github.io/wareezbooster/ it will pop here instantly.</div>'; return; }
  c.innerHTML = orders.map((o,i)=>`
    <div onclick="select(${i})" class="border ${selected && selected.fid===o.fid?'!border-purple-600 bg-purple-600/10':'border-zinc-800 bg-black'} p-4 rounded-2xl cursor-pointer">
      <div class="flex justify-between">
        <div><p class="font-bold text-sm">${o.package_name} <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded-full">${o.id||''}</span></p><p class="text-xs text-zinc-400 truncate max-w-[250px]">${o.link}</p><p class="text-xs text-zinc-500"><i class="fab fa-whatsapp text-green-500"></i> ${o.whatsapp}</p></div>
        <div class="text-right"><p class="font-black text-purple-400">₦${o.price}</p><span class="text-[9px] px-2 py-1 rounded-full ${o.status==='pending_payment'?'bg-yellow-500/20 text-yellow-400':'bg-green-500/20 text-green-400'}">${o.status}</span></div>
      </div>
      ${o.proof_url?`<a href="${o.proof_url}" target="_blank" class="text-[10px] text-blue-400 underline mt-2 inline-block">View Receipt</a>`:''}
    </div>
  `).join('');
}

function select(i){
  selected = orders[i];
  render();
  document.getElementById('action').innerHTML = `
    <div class="text-left space-y-3">
      ${selected.proof_url?`<img src="${selected.proof_url}" class="w-full rounded-xl border border-zinc-800 max-h-[250px] object-contain bg-zinc-900">`:''}
      <p class="text-xs"><b>Package:</b> ${selected.package_name} (${selected.qty})</p>
      <p class="text-xs"><b>Price:</b> <span class="text-green-400 font-black">₦${selected.price}</span></p>
      <p class="text-xs break-all"><b>Link:</b> <a href="${selected.link}" target="_blank" class="text-purple-400 underline">${selected.link}</a></p>
      <p class="text-xs"><b>WhatsApp:</b> <a href="https://wa.me/${(selected.whatsapp||'').replace(/[^0-9]/g,'')}" target="_blank" class="text-green-400">${selected.whatsapp}</a></p>
      <div class="pt-3 space-y-2">
        <button onclick="markCompleted()" class="w-full bg-green-600 p-3 rounded-xl font-bold text-sm">✅ Confirm Payment Received (Kuda 3003350273) & Mark Completed</button>
        <button onclick="del()" class="w-full bg-red-500/10 text-red-400 border border-red-500/20 p-3 rounded-xl text-xs">Delete</button>
      </div>
    </div>
  `;
}

async function markCompleted(){
  await db.collection('wareez_orders').doc(selected.fid).update({status:'completed'});
}

async function del(){
  if(!confirm('Delete?')) return;
  await db.collection('wareez_orders').doc(selected.fid).delete();
}
</script>
